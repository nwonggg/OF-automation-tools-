<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Fulfillment Tools — Twist Bioscience</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  :root{
    --ink:#232e35;
    --ink-soft:#5b6b7a;
    --ink-faint:#8b98a3;
    --line:#e2e5e2;
    --line-soft:#ecefec;
    --bg:#f4f5f4;
    --panel:#ffffff;
    --accent:#04a973;
    --accent-strong:#19805e;
    --accent-soft:#e1f9f1;
    --accent-grad-a:#19805e;
    --accent-grad-b:#2ad39b;
    --glass:rgba(244,245,244,0.55);
    --glass-edge:rgba(255,255,255,0.7);
    --shadow:0 18px 40px -18px rgba(35,46,53,0.35);
    --transition: background .18s ease, border-color .18s ease, color .18s ease;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --ink:#e0e5eb;
    --ink-soft:#98a8b3;
    --ink-faint:#6d7d88;
    --line:#354652;
    --line-soft:#2a3841;
    --bg:#0f0f10;
    --panel:#1a232a;
    --accent:#2ad39b;
    --accent-strong:#2ad39b;
    --accent-soft:#15332a;
    --accent-grad-a:#144348;
    --accent-grad-b:#2ad39b;
    --glass:rgba(15,15,16,0.55);
    --glass-edge:rgba(255,255,255,0.08);
    --shadow:0 18px 40px -18px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  html{background:var(--bg);}
  body{
    font-family:-apple-system, "Segoe UI", system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px);
    transition:var(--transition);
  }

  /* ---------- Shared header ---------- */
  .topbar{
    height:4px; width:100%; flex-shrink:0;
    background:linear-gradient(90deg, var(--accent-grad-a), var(--accent-grad-b));
  }
  .hub{flex-shrink:0;border-bottom:1px solid var(--line);padding:0 20px;}
  /* Left corner: Home · Center: tool tabs · Right corner: brand + toggle */
  .hub-inner{
    padding:12px 0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:16px;
  }
  .left{justify-self:start;}
  .right{justify-self:end;display:flex;align-items:center;gap:12px;}

  .home-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;padding:0;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--ink-soft);text-decoration:none;
    font-size:14px;font-weight:600;white-space:nowrap;
    transition:var(--transition);
  }
  .home-btn svg{width:18px;height:18px;}
  .home-btn:hover{color:var(--ink);background:var(--line-soft);}
  .home-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;}

  nav{
    display:flex; gap:4px; padding:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    overflow-x:auto; scrollbar-width:none; max-width:100%;
  }
  nav::-webkit-scrollbar{display:none;}
  nav a{
    padding:7px 14px; border-radius:7px;
    color:var(--ink-soft); text-decoration:none;
    font-size:14px; font-weight:600; white-space:nowrap;
    transition:var(--transition);
  }
  nav a:hover{color:var(--ink);background:var(--line-soft);}
  nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);}

  .newtab{font-size:12px;font-weight:600;color:var(--ink-soft);text-decoration:none;white-space:nowrap;}
  .newtab:hover{color:var(--accent-strong);}
  .newtab[hidden]{display:none;}

  .brand{display:flex;align-items:center;gap:7px;text-decoration:none;}
  .brand-word{font-weight:700;font-size:11px;letter-spacing:.32em;color:var(--ink);white-space:nowrap;}
  .brand-dot{color:var(--accent);font-weight:700;font-size:11px;}
  .brand-sub{font-weight:700;font-size:11px;letter-spacing:.28em;color:var(--accent);white-space:nowrap;}

  .theme-toggle{
    width:46px;height:24px;border-radius:999px;
    border:1px solid var(--line);background:var(--line-soft);
    cursor:pointer;padding:2px;
    display:flex;align-items:center;justify-content:flex-start;
    transition:var(--transition);
  }
  .theme-toggle.on{justify-content:flex-end;}
  .theme-toggle .knob{
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;flex-shrink:0;
  }
  nav a:focus-visible,.home-btn:focus-visible,.newtab:focus-visible,.theme-toggle:focus-visible,.tile:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;
  }

  /* ---------- Home ---------- */
  main{flex:1;position:relative;}
  #home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;}
  #home[hidden]{display:none;}

  /* Hero stays pinned while the content sheet scrolls up over it */
  .hero{
    --p:0;
    position:sticky;top:0;z-index:0;
    height:min(64vh, 560px);min-height:300px;
    display:flex;align-items:center;
    padding:0 20px;overflow:hidden;
    background:
      radial-gradient(60% 80% at 85% 20%, color-mix(in srgb, var(--accent-grad-b) 22%, transparent), transparent 70%),
      radial-gradient(50% 70% at 10% 90%, color-mix(in srgb, var(--accent-grad-a) 18%, transparent), transparent 70%),
      var(--accent-soft);
  }
  .hero-inner{
    max-width:1080px;margin:0 auto;width:100%;
    transform:translateY(calc(var(--p) * -60px)) scale(calc(1 - var(--p) * .06));
    opacity:calc(1 - var(--p) * 1.1);
    transform-origin:left center;
    will-change:transform, opacity;
  }
  .eyebrow{
    display:inline-block;margin-bottom:14px;
    font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent-strong);
  }
  .hero h1{
    font-size:clamp(36px, 6.2vw, 68px);font-weight:800;line-height:1.02;
    letter-spacing:-.02em;margin:0 0 14px;
  }
  .hero p{margin:0;max-width:520px;color:var(--ink-soft);font-size:16px;line-height:1.5;}
  .scroll-hint{
    margin-top:28px;display:inline-flex;align-items:center;gap:8px;
    background:none;border:0;padding:0;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);
  }
  .scroll-hint:hover{color:var(--accent-strong);}
  .scroll-hint .arrow{display:inline-block;animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  .sheet{
    position:relative;z-index:2;
    background:var(--bg);
    border-top:1px solid var(--line);
    border-radius:26px 26px 0 0;
    box-shadow:0 -18px 40px -30px rgba(0,0,0,.28);
    min-height:calc(100% - 60px);
    padding:40px 20px 80px;
  }
  .home-wrap{max-width:1080px;margin:0 auto;}
  .section-label{
    margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint);
  }

  /* Pop-in as things scroll into view */
  .reveal{
    opacity:0;transform:translateY(56px) scale(.97);
    transition:opacity .7s ease, transform .8s cubic-bezier(.16,.84,.24,1);
    transition-delay:var(--d, 0ms);
  }
  .reveal.in{opacity:1;transform:none;}

  .tiles{display:grid;grid-template-columns:repeat(3, 1fr);gap:22px;}
  .tile{
    position:relative; display:block;
    text-decoration:none; color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line); border-radius:14px;
    overflow:hidden;
    transform:translateZ(0) scale(1);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .2s ease;
  }
  .tile:hover,.tile:focus-visible{
    transform:scale(1.04);
    box-shadow:var(--shadow);
    border-color:var(--accent);
    z-index:1;
  }

  /* Live, scaled-down snapshot of the tool */
  .preview{position:relative;aspect-ratio:4 / 3;overflow:hidden;background:var(--bg);}
  .preview iframe{
    position:absolute;top:0;left:0;
    width:1280px;height:960px;border:0;
    transform-origin:0 0;
    transform:scale(var(--s, .27));
    pointer-events:none;
    filter:saturate(.35);
    transition:filter .3s ease;
  }
  .tile:hover .preview iframe,.tile:focus-visible .preview iframe{filter:none;}

  /* Frosted glass over the snapshot */
  .glass{
    position:absolute;inset:0;
    background:var(--glass);
    backdrop-filter:blur(7px) saturate(.8);
    -webkit-backdrop-filter:blur(7px) saturate(.8);
    box-shadow:inset 0 1px 0 var(--glass-edge);
    display:flex;align-items:center;justify-content:center;
    transition:background .3s ease, backdrop-filter .3s ease, -webkit-backdrop-filter .3s ease, opacity .3s ease;
  }
  .glass span{
    font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);
    transition:opacity .2s ease;
  }
  .tile:hover .glass,.tile:focus-visible .glass{
    background:transparent;
    backdrop-filter:blur(0) saturate(1);
    -webkit-backdrop-filter:blur(0) saturate(1);
  }
  .tile:hover .glass span,.tile:focus-visible .glass span{opacity:0;}

  .tile-body{
    padding:14px 16px 16px;
    border-top:1px solid var(--line);
    transition:background .28s ease;
  }
  .tile-body h2{
    margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);transition:color .2s ease;
  }
  .tile-body p{margin:0;font-size:13px;line-height:1.45;color:var(--ink-soft);}
  .tile-body .go{
    display:inline-block;margin-top:10px;font-size:13px;font-weight:600;
    color:var(--ink-faint);transition:color .2s ease, transform .2s ease;
  }
  .tile:hover .tile-body,.tile:focus-visible .tile-body{background:var(--accent-soft);}
  .tile:hover .tile-body h2,.tile:focus-visible .tile-body h2{color:var(--accent-strong);}
  .tile:hover .go,.tile:focus-visible .go{color:var(--accent-strong);transform:translateX(3px);}

  /* ---------- Tool view ---------- */
  .tool-frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    display:none;background:var(--bg);
  }
  .tool-frame.active{display:block;}

  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    .hero-inner{transform:none !important;opacity:1 !important;}
    .scroll-hint .arrow{animation:none;}
    .tile,.tile *{transition:none !important;}
    .tile:hover,.tile:focus-visible{transform:none;}
  }
  @media (max-width:900px){
    .tiles{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:760px){
    /* Home + brand share the top row, tool tabs drop below */
    .hub-inner{grid-template-columns:auto 1fr;}
    .center{grid-column:1 / -1;grid-row:2;justify-self:center;max-width:100%;}
    .newtab{display:none;}
  }
  @media (max-width:640px){
    .tiles{grid-template-columns:1fr;}
    .hero{height:52vh;}
    .sheet{border-radius:20px 20px 0 0;padding-top:28px;}
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="hub">
  <div class="hub-inner">
    <div class="left">
      <a class="home-btn" id="homeBtn" href="#" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>
        </svg>
      </a>
    </div>
    <nav class="center" id="tabs" aria-label="Tools"></nav>
    <div class="right">
      <a class="newtab" id="newtab" target="_blank" rel="noopener" hidden>Open in new tab ↗</a>
      <a class="brand" href="#" aria-label="Twist Bioscience — Home">
        <span class="brand-word">T W I S T</span>
        <span class="brand-dot">·</span>
        <span class="brand-sub">BIOSCIENCE</span>
      </a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light or dark mode">
        <span class="knob" id="themeIcon">☀</span>
      </button>
    </div>
  </div>
</div>

<main id="frames">
  <section id="home">
    <header class="hero" id="hero">
      <div class="hero-inner">
        <span class="eyebrow">Twist Bioscience · Shipping</span>
        <h1>Order Fulfillment<br>Tools</h1>
        <p>Pick a tool to get started. Your work in each one stays put while you switch between them.</p>
        <button class="scroll-hint" id="scrollHint" type="button">Browse tools <span class="arrow">↓</span></button>
      </div>
    </header>
    <div class="sheet">
      <div class="home-wrap">
        <h2 class="section-label reveal">All tools</h2>
        <div class="tiles" id="tiles"></div>
      </div>
    </div>
  </section>
</main>

<script>
  // Add, rename or reorder tools here.
  const TOOLS = [
    { id: "packing", name: "Packing Slips",  url: "https://nwonggg.github.io/-packing-slip-generator-/",
      blurb: "Enter shipment details once, split items across boxes, and download a PDF slip for each box." },
    { id: "adc-coo", name: "ADC & COO",      url: "https://nwonggg.github.io/adc-coo-ci/",
      blurb: "Pick list in, ADC Excel out. Packing slips in, Certificate of Origin out." },
    { id: "hts",     name: "HTS Calculator", url: "https://nwonggg.github.io/HTS-Calculator/",
      blurb: "Upload commercial invoices, match line items to HS codes, and get totals per code." }
  ];

  const tabs = document.getElementById("tabs");
  const homeBtn = document.getElementById("homeBtn");
  const frames = document.getElementById("frames");
  const home = document.getElementById("home");
  const tiles = document.getElementById("tiles");
  const newtab = document.getElementById("newtab");
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const toolFrames = {};
  const previewFrames = [];
  let theme = "light";

  // ---------- Theme (also flips every embedded tool that supports it) ----------
  function applyThemeTo(frame){
    try{
      const w = frame.contentWindow;
      if (typeof w.setTheme === "function") w.setTheme(theme);
      else if (w.document) w.document.documentElement.setAttribute("data-theme", theme);
    }catch(e){}
  }
  function allFrames(){ return [...Object.values(toolFrames), ...previewFrames]; }
  function setTheme(mode){
    theme = mode === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    themeIcon.textContent = theme === "dark" ? "☾" : "☀";
    themeToggle.classList.toggle("on", theme === "dark");
    allFrames().forEach(applyThemeTo);
  }
  themeToggle.addEventListener("click", () => setTheme(theme === "dark" ? "light" : "dark"));
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(prefersDark ? "dark" : "light");

  // ---------- Tool tabs (center) ----------
  TOOLS.forEach(t => {
    const a = document.createElement("a");
    a.href = "#" + t.id;
    a.textContent = t.name;
    a.dataset.id = t.id;
    tabs.appendChild(a);
  });

  // ---------- Home tiles with live previews ----------
  TOOLS.forEach((t, i) => {
    const wrap = document.createElement("div");
    wrap.className = "reveal";
    wrap.style.setProperty("--d", (i * 110) + "ms");
    const a = document.createElement("a");
    a.className = "tile";
    a.href = "#" + t.id;
    a.innerHTML = `
      <div class="preview">
        <iframe tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
        <div class="glass"><span>${t.name}</span></div>
      </div>
      <div class="tile-body">
        <h2>${t.name}</h2>
        <p>${t.blurb}</p>
        <span class="go">Open →</span>
      </div>`;
    const f = a.querySelector("iframe");
    f.src = t.url;
    f.addEventListener("load", () => applyThemeTo(f));
    previewFrames.push(f);
    wrap.appendChild(a);
    tiles.appendChild(wrap);
  });

  // ---------- Scroll effects on the home screen ----------
  const hero = document.getElementById("hero");
  let ticking = false;
  home.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const p = Math.min(1, home.scrollTop / (hero.offsetHeight * 0.9));
      hero.style.setProperty("--p", p.toFixed(3));
      ticking = false;
    });
  }, { passive: true });

  document.getElementById("scrollHint").addEventListener("click", () => {
    home.scrollTo({ top: hero.offsetHeight - 40, behavior: "smooth" });
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { root: home, threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  // Scale each 1280px-wide preview to fit its tile.
  const ro = new ResizeObserver(entries => {
    entries.forEach(e => e.target.style.setProperty("--s", e.contentRect.width / 1280));
  });
  document.querySelectorAll(".preview").forEach(p => ro.observe(p));

  // ---------- Routing ----------
  function show(id){
    const tool = TOOLS.find(t => t.id === id);

    tabs.querySelectorAll("a").forEach(a => {
      if (tool && a.dataset.id === tool.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (tool) homeBtn.removeAttribute("aria-current");
    else homeBtn.setAttribute("aria-current", "page");

    if (!tool){
      home.hidden = false;
      Object.values(toolFrames).forEach(f => f.classList.remove("active"));
      newtab.hidden = true;
      document.title = "Order Fulfillment Tools — Twist Bioscience";
      return;
    }

    // Each tool loads once and stays alive, so work in progress survives switching.
    if (!toolFrames[tool.id]){
      const f = document.createElement("iframe");
      f.className = "tool-frame";
      f.src = tool.url;
      f.title = tool.name;
      f.dataset.id = tool.id;
      f.setAttribute("allow", "clipboard-read; clipboard-write");
      f.addEventListener("load", () => applyThemeTo(f));
      frames.appendChild(f);
      toolFrames[tool.id] = f;
    }
    home.hidden = true;
    Object.values(toolFrames).forEach(f => f.classList.toggle("active", f.dataset.id === tool.id));
    newtab.hidden = false;
    newtab.href = tool.url;
    document.title = tool.name + " — Twist Bioscience";
  }

  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
