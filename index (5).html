<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twist Bioscience — Shipping Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  :root{
    --ink:#232e35;
    --ink-soft:#5b6b7a;
    --line:#e2e5e2;
    --line-soft:#ecefec;
    --bg:#f4f5f4;
    --panel:#ffffff;
    --accent:#04a973;
    --accent-strong:#19805e;
    --accent-soft:#e1f9f1;
    --accent-grad-a:#19805e;
    --accent-grad-b:#2ad39b;
    --transition: background .18s ease, border-color .18s ease, color .18s ease;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --ink:#e0e5eb;
    --ink-soft:#98a8b3;
    --line:#354652;
    --line-soft:#2a3841;
    --bg:#0f0f10;
    --panel:#1a232a;
    --accent:#2ad39b;
    --accent-strong:#2ad39b;
    --accent-soft:#15332a;
    --accent-grad-a:#144348;
    --accent-grad-b:#2ad39b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  html{background:var(--bg);}
  body{
    font-family:-apple-system, "Segoe UI", system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px);
    transition:var(--transition);
  }

  .topbar{
    height:4px;
    width:100%;
    max-width:1080px;
    margin:0 auto;
    border-radius:0 0 4px 4px;
    background:linear-gradient(90deg, var(--accent-grad-a), var(--accent-grad-b));
    flex-shrink:0;
  }
  .hub{
    flex-shrink:0;
    border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  .hub-inner{
    max-width:1080px;
    margin:0 auto;
    padding:16px 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  nav{
    display:flex;
    gap:4px;
    padding:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow-x:auto;
    scrollbar-width:none;
    max-width:100%;
  }
  nav::-webkit-scrollbar{display:none;}
  nav a{
    padding:7px 14px;
    border-radius:7px;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    transition:var(--transition);
  }
  nav a:hover{color:var(--ink);background:var(--line-soft);}
  nav a[aria-current="page"]{
    background:var(--accent-soft);
    color:var(--accent-strong);
  }

  .right{display:flex;align-items:center;gap:14px;}
  .newtab{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
    white-space:nowrap;
  }
  .newtab:hover{color:var(--accent-strong);}

  .brand{display:flex;align-items:center;gap:10px;}
  .brand-word{font-weight:700;font-size:14px;letter-spacing:.32em;color:var(--ink);white-space:nowrap;}
  .brand-dot{color:var(--accent);font-weight:700;}
  .brand-sub{font-weight:700;font-size:14px;letter-spacing:.28em;color:var(--accent);white-space:nowrap;}

  .theme-toggle{
    width:64px;height:34px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--line-soft);
    cursor:pointer;
    margin-left:4px;
    padding:3px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    transition:var(--transition);
  }
  .theme-toggle.on{justify-content:flex-end;}
  .theme-toggle .knob{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    flex-shrink:0;
  }

  nav a:focus-visible, .newtab:focus-visible, .theme-toggle:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  main{flex:1;position:relative;}
  iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;
    display:none;
    background:var(--bg);
  }
  iframe.active{display:block;}

  @media (max-width:720px){
    .hub-inner{flex-direction:column-reverse;align-items:stretch;}
    .right{justify-content:space-between;}
    .brand-word,.brand-sub{font-size:12px;}
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="hub">
  <div class="hub-inner">
    <nav id="tabs" aria-label="Tools"></nav>
    <div class="right">
      <a class="newtab" id="newtab" target="_blank" rel="noopener">Open in new tab ↗</a>
      <div class="brand">
        <span class="brand-word">T W I S T</span>
        <span class="brand-dot">·</span>
        <span class="brand-sub">BIOSCIENCE</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark mode">
          <span class="knob" id="themeIcon">☀</span>
        </button>
      </div>
    </div>
  </div>
</div>
<main id="frames"></main>

<script>
  // Add, rename or reorder tools here.
  const TOOLS = [
    { id: "packing", name: "Packing Slips",  url: "https://nwonggg.github.io/-packing-slip-generator-/" },
    { id: "adc-coo", name: "ADC & COO",      url: "https://nwonggg.github.io/adc-coo-ci/" },
    { id: "hts",     name: "HTS Calculator", url: "https://nwonggg.github.io/HTS-Calculator/" }
  ];

  const tabs = document.getElementById("tabs");
  const frames = document.getElementById("frames");
  const newtab = document.getElementById("newtab");
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const loaded = {};
  let theme = "light";

  // Theme: the hub toggle also flips any tool that supports dark mode,
  // so everything on screen stays in the same mode.
  function applyThemeTo(frame){
    try{
      const w = frame.contentWindow;
      if (typeof w.setTheme === "function") w.setTheme(theme);
      else if (w.document) w.document.documentElement.setAttribute("data-theme", theme);
    }catch(e){ /* tool on another domain; leave it alone */ }
  }
  function setTheme(mode){
    theme = mode === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    themeIcon.textContent = theme === "dark" ? "☾" : "☀";
    themeToggle.classList.toggle("on", theme === "dark");
    Object.values(loaded).forEach(applyThemeTo);
  }
  themeToggle.addEventListener("click", () => setTheme(theme === "dark" ? "light" : "dark"));
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(prefersDark ? "dark" : "light");

  TOOLS.forEach(t => {
    const a = document.createElement("a");
    a.href = "#" + t.id;
    a.textContent = t.name;
    a.dataset.id = t.id;
    tabs.appendChild(a);
  });

  function show(id){
    const tool = TOOLS.find(t => t.id === id) || TOOLS[0];

    // Each tool loads once and stays alive, so work in progress
    // survives switching tabs.
    if (!loaded[tool.id]){
      const f = document.createElement("iframe");
      f.src = tool.url;
      f.title = tool.name;
      f.dataset.id = tool.id;
      f.setAttribute("allow", "clipboard-read; clipboard-write");
      f.addEventListener("load", () => applyThemeTo(f));
      frames.appendChild(f);
      loaded[tool.id] = f;
    }

    Object.values(loaded).forEach(f => f.classList.toggle("active", f.dataset.id === tool.id));
    tabs.querySelectorAll("a").forEach(a => {
      if (a.dataset.id === tool.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    newtab.href = tool.url;
    document.title = tool.name + " — Twist Bioscience";
  }

  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
